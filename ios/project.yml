# The Xcode project is generated from this spec by XcodeGen (version pinned in
# .github/workflows/ci.yml); the .xcodeproj is not committed.
#   xcodegen generate --spec ios/project.yml
# It is unsigned (DEVELOPMENT_TEAM is empty): CI builds for the simulator. To
# run on an iPhone, a git-ignored ios/project.local.yml includes this file and
# adds your team (ios/project.local.yml.example; README "Install on your
# iPhone with a free Apple ID").
name: Parley
options:
  bundleIdPrefix: com.scshafe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app's bundle id; ios/project.local.yml can override it.
    PARLEY_BUNDLE_ID: com.scshafe.parley
    # Pocket ID sign-in: the issuer (its discovery document) and the public
    # client. ios/project.local.yml can override them.
    PARLEY_OIDC_ISSUER: https://id.colobus-stargazer.ts.net
    PARLEY_OIDC_CLIENT_ID: parley-ios
packages:
  ParleyKit:
    path: ParleyKit
targets:
  Parley:
    type: application
    platform: iOS
    sources:
      - path: Parley
    dependencies:
      - package: ParleyKit
    info:
      path: Parley/Info.plist
      properties:
        CFBundleDisplayName: Parley
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Sign-in (B10): Pocket ID redirects to com.scshafe.parley://oauth/callback.
        CFBundleURLTypes:
          - CFBundleURLName: com.scshafe.parley.oauth
            CFBundleURLSchemes: [com.scshafe.parley]
        ParleyOIDCIssuer: $(PARLEY_OIDC_ISSUER)
        ParleyOIDCClientID: $(PARLEY_OIDC_CLIENT_ID)
        ParleyOIDCRedirectURI: com.scshafe.parley://oauth/callback
        NSAppTransportSecurity:
          # The relay is https on the tailnet; plain http only for a dev relay
          # on this machine (the simulator) or the local network.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARLEY_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ParleyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParleyUITests
    dependencies:
      - target: Parley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scshafe.parley.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Parley
schemes:
  Parley:
    build:
      targets:
        Parley: all
        ParleyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ParleyUITests
      environmentVariables:
        PARLEY_RELAY_URL: http://127.0.0.1:8765
        PARLEY_DEV_TOKEN: parley-dev
