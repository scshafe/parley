# The Xcode project is generated from this spec by XcodeGen (version pinned in
# .github/workflows/ci.yml); the .xcodeproj is not committed.
#   xcodegen generate --spec ios/project.yml
# It is unsigned (DEVELOPMENT_TEAM is empty): CI builds for the simulator. To
# run on an iPhone, a git-ignored ios/project.local.yml includes this file and
# adds your team (ios/project.local.yml.example; README "Install on your
# iPhone with a free Apple ID").
name: Parley
options:
  bundleIdPrefix: com.scshafe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app's bundle id; ios/project.local.yml can override it.
    PARLEY_BUNDLE_ID: com.scshafe.parley
    # Pocket ID sign-in: the issuer (its discovery document) and the public
    # client. ios/project.local.yml can override them.
    PARLEY_OIDC_ISSUER: https://id.colobus-stargazer.ts.net
    PARLEY_OIDC_CLIENT_ID: parley-ios
    # The signed-in session's token is sent only over https to a relay host
    # under this suffix; the app refuses any other relay.
    PARLEY_RELAY_HOST_SUFFIX: .colobus-stargazer.ts.net
    # The relay the login screen starts with (the person can change it).
    PARLEY_DEFAULT_RELAY_URL: https://parley.colobus-stargazer.ts.net
    # Push notifications (B11) are opt-in: NO builds with no entitlements and
    # never registers for remote notifications, which a free (personal) team
    # needs. With a paid team, set PARLEY_PUSH: YES in ios/project.local.yml;
    # the target then signs Entitlements/Parley-Push.entitlements.
    PARLEY_PUSH: "NO"
    PARLEY_PUSH_ENTITLEMENTS_YES: Entitlements/Parley-Push.entitlements
packages:
  ParleyKit:
    path: ParleyKit
targets:
  Parley:
    type: application
    platform: iOS
    sources:
      - path: Parley
    dependencies:
      - package: ParleyKit
    info:
      path: Parley/Info.plist
      properties:
        CFBundleDisplayName: Parley
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Sign-in (B10): Pocket ID redirects to com.scshafe.parley://oauth/callback.
        CFBundleURLTypes:
          - CFBundleURLName: com.scshafe.parley.oauth
            CFBundleURLSchemes: [com.scshafe.parley]
        ParleyOIDCIssuer: $(PARLEY_OIDC_ISSUER)
        ParleyOIDCClientID: $(PARLEY_OIDC_CLIENT_ID)
        ParleyOIDCRedirectURI: com.scshafe.parley://oauth/callback
        ParleyRelayHostSuffix: $(PARLEY_RELAY_HOST_SUFFIX)
        ParleyDefaultRelayURL: $(PARLEY_DEFAULT_RELAY_URL)
        ParleyPushEnabled: $(PARLEY_PUSH)
        NSAppTransportSecurity:
          # The relay is https on the tailnet. Plain http is only for the UI
          # tests' local relay in the simulator (Parley/UITestSeam.swift).
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARLEY_BUNDLE_ID)
        # Empty unless PARLEY_PUSH is YES.
        CODE_SIGN_ENTITLEMENTS: $(PARLEY_PUSH_ENTITLEMENTS_$(PARLEY_PUSH))
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ParleyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParleyUITests
    dependencies:
      - target: Parley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scshafe.parley.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Parley
schemes:
  Parley:
    build:
      targets:
        Parley: all
        ParleyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ParleyUITests
      # The UI tests' fake session against `parley-relay --dev` (its public
      # placeholder bearer), honoured only by a debug simulator build.
      environmentVariables:
        PARLEY_UI_TEST_RELAY_URL: http://127.0.0.1:8765
        PARLEY_UI_TEST_ACCESS_TOKEN: parley-dev
