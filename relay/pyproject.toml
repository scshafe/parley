[project]
name = "parley-relay"
version = "0.1.0"
description = "Parley's relay: turns to the agent, replies to voice-lab speech, follow-along timings to the app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "httpx>=0.28",
]

[project.scripts]
parley-relay = "parley_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

# uv's own build backend, pinned to the uv the repository uses (ci.yml, the
# Dockerfile): no dependencies of its own, so the image build fetches nothing
# unpinned. It packages src/parley_relay, prompts included.
[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
